<!DOCTYPE html>
<html>

<head>
    <title>Fortschritt</title>
    <meta charset="utf-8">
    <link rel="canonical" href="https://ckerth7.github.io/calendar/" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="apple-touch-icon.png" width="32" height="32">
    <meta name="theme-color" content="#0F8A5F" />
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 30px 20px;
            background: #f5f6f8;
            color: #222;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        h1 {
            font-size: 26px;
            margin-bottom: 8px;
        }

        .description {
            color: #666;
            margin-bottom: 25px;
        }

        .scale {
          display: grid;
          grid-template-columns: 1fr;
          gap: 12px;
        }

        .box {
            min-height: 145px;
            border: 2px solid transparent;
            border-radius: 12px;
            padding: 16px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            cursor: pointer;
            color: #172016;
            transition: transform 0.15s, border-color 0.15s;
            overflow-wrap: anywhere;
        }

        .box:hover {
            transform: translateY(-3px);
            border-color: rgba(0, 0, 0, 0.35);
        }

        .box:focus-visible {
            outline: 3px solid #222;
            outline-offset: 3px;
        }

        .number {
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .box-text {
            font-size: 14px;
            line-height: 1.4;
            white-space: pre-wrap;
        }

        .edit-hint {
            font-size: 11px;
            margin-top: 12px;
            opacity: 0.75;
        }

        .status {
            margin-top: 20px;
            min-height: 22px;
            font-size: 13px;
            color: #387344;
        }

        .reset {
            margin-top: 12px;
            padding: 10px 16px;
            border: 1px solid #ccc;
            border-radius: 7px;
            background: white;
            cursor: pointer;
        }

        .reset:hover {
            background: #eee;
        }

        /* Bearbeitungsfenster */
        dialog {
            width: min(420px, calc(100% - 30px));
            border: none;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        dialog::backdrop {
            background: rgba(0, 0, 0, 0.45);
        }

        dialog h2 {
            margin-top: 0;
            font-size: 20px;
        }

        textarea {
            display: block;
            width: 100%;
            min-height: 120px;
            padding: 12px;
            margin: 15px 0;
            border: 1px solid #bbb;
            border-radius: 7px;
            font: inherit;
            resize: vertical;
        }

        .dialog-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .dialog-actions button {
            padding: 10px 16px;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-size: 14px;
        }

        .cancel {
            background: #eee;
        }

        .save {
            background: #2563eb;
            color: white;
        }

        @media (max-width: 480px) {
            .scale {
                grid-template-columns: 1fr !important;
            }

            .box {
                min-height: 125px;
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <script>
        if (navigator.serviceWorker) {
            navigator.serviceWorker.register('/calendar/sw.js', {scope: '/calendar/'})
        }
    </script>

    <div class="container">

    <h1>Fortschritt</h1>
    <p class="description">
        Klicke auf ein Level, um den zugehörigen Inhalt zu bearbeiten.
    </p>

    <div class="scale" id="scale"></div>

    <div class="status" id="status" aria-live="polite">
        Inhalt wird automatisch gespeichert.
    </div>

    <button class="reset" id="reset" type="button">
        Alle Inhalte zurücksetzen
    </button>

</div>

<dialog id="editor">
    <form id="editForm">
        <h2 id="editorTitle">Inhalt bearbeiten</h2>

        <label for="textInput">
            Inhalt für dieses Level:
        </label>

        <textarea
            id="textInput"
            maxlength="2000"
            placeholder="Hier deinen Inhalt eingeben ..."
        ></textarea>

        <div class="dialog-actions">
            <button type="button" class="cancel" id="cancel">
                Abbrechen
            </button>

            <button type="submit" class="save">
                Speichern
            </button>
        </div>
    </form>
</dialog>

<script>
    const scale = document.getElementById("scale");
    const editor = document.getElementById("editor");
    const editForm = document.getElementById("editForm");
    const textInput = document.getElementById("textInput");
    const editorTitle = document.getElementById("editorTitle");
    const status = document.getElementById("status");

    const STORAGE_KEY = "bewertungsskala_0_bis_10";

    // Starttexte für alle Zahlen
    const defaults = {
        0: "Sehr gut",
        1: "",
        2: "",
        3: "",
        4: "",
        5: "Mittel",
        6: "",
        7: "",
        8: "",
        9: "",
        10: "Sehr schlecht"
    };

    let texts = loadTexts();
    let activeNumber = null;

    // Farben: Grün (0) über Gelb bis Rot (10)
    function getColor(number) {
        const hue = 120 - number * 12;
        return `hsl(${hue}, 75%, 65%)`;
    }

    function loadTexts() {
        try {
            const stored = localStorage.getItem(STORAGE_KEY);

            if (stored) {
                const parsed = JSON.parse(stored);

                for (let i = 0; i <= 10; i++) {
                    if (typeof parsed[i] !== "string") {
                        parsed[i] = defaults[i];
                    }
                }

                return parsed;
            }
        } catch (error) {
            console.warn("Gespeicherte Inhalte konnten nicht geladen werden.", error);
        }

        return { ...defaults };
    }

    function saveTexts() {
        try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(texts));
            status.textContent = "✓ Änderungen wurden gespeichert.";
            return true;
        } catch (error) {
            status.textContent =
                "Speichern nicht möglich. Bitte Browsereinstellungen prüfen.";
            return false;
        }
    }

    function render() {
        scale.replaceChildren();

        for (let i = 0; i <= 10; i++) {
            const box = document.createElement("button");

            box.type = "button";
            box.className = "box";
            box.style.backgroundColor = getColor(i);
            box.setAttribute(
                "aria-label",
                `Bewertung ${i}: ${texts[i] || "Kein Inhalt"}. Bearbeiten`
            );

            const number = document.createElement("span");
            number.className = "number";
            number.textContent = i;

            const text = document.createElement("span");
            text.className = "box-text";
            text.textContent = texts[i] || "Kein Inhalt";

            const hint = document.createElement("span");
            hint.className = "edit-hint";
            hint.textContent = "✎ Inhalt bearbeiten";

            box.append(number, text, hint);

            box.addEventListener("click", () => openEditor(i));

            scale.appendChild(box);
        }
    }

    function openEditor(number) {
        activeNumber = number;

        editorTitle.textContent = `Inhalt für Bewertung ${number}`;
        textInput.value = texts[number] || "";

        editor.showModal();
        textInput.focus();
    }

    editForm.addEventListener("submit", function(event) {
        event.preventDefault();

        if (activeNumber === null) return;

        const oldText = texts[activeNumber];
        texts[activeNumber] = textInput.value.trim();

        if (!saveTexts()) {
            texts[activeNumber] = oldText;
            return;
        }

        render();
        editor.close();
        activeNumber = null;
    });

    document.getElementById("cancel").addEventListener("click", () => {
        editor.close();
        activeNumber = null;
    });

    document.getElementById("reset").addEventListener("click", () => {
        const confirmed = confirm(
            "Möchtest du wirklich alle Inhalte zurücksetzen?"
        );

        if (!confirmed) return;

        texts = { ...defaults };

        if (saveTexts()) {
            render();
            status.textContent = "Alle Inhalte wurden zurückgesetzt.";
        }
    });

    // Initiale Anzeige
    render();
</script>

</body>

</html>
