<!DOCTYPE html>
<html>

<head>
    <title>Fortschritt</title>
    <meta charset="utf-8">
    <link rel="canonical" href="https://ckerth7.github.io/calendar/" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="apple-touch-icon.png" width="32" height="32">
    <meta name="theme-color" content="#0F8A5F" />
    <style>
    * {
      box-sizing: border-box;
    }

    body {
      max-width: 680px;
      margin: 40px auto;
      padding: 0 16px;
      font-family: system-ui, sans-serif;
      color: #222;
      background: #f5f6f8;
    }

    h1 {
      margin-bottom: 20px;
    }

    #add-task {
      padding: 10px 16px;
      border: 0;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font: inherit;
      cursor: pointer;
    }

    #add-task:hover {
      background: #1d4ed8;
    }

    #tasks {
      display: grid;
      gap: 10px;
      margin: 20px 0 0;
      padding: 0;
      list-style: none;
    }

    .task {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px;
      border: 1px solid #aaa;
      border-radius: 10px;
    }

    .task input[type="text"] {
      flex: 1;
      min-width: 0;
      padding: 8px;
      border: 1px solid #888;
      border-radius: 6px;
      font: inherit;
    }

    .score-controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .score-controls button,
    .delete-button {
      height: 36px;
      border: 1px solid #888;
      border-radius: 6px;
      background: white;
      font: inherit;
      cursor: pointer;
    }

    .score-controls button {
      width: 36px;
      font-size: 1.2rem;
    }

    .score-controls button:hover {
      background: #eee;
    }

    .score-controls input[type="number"] {
      width: 64px;
      padding: 8px;
      border: 1px solid #888;
      border-radius: 6px;
      font: inherit;
      text-align: center;
    }

    .score-label {
      min-width: 70px;
      font-size: 0.9rem;
      text-align: right;
    }

    .delete-button {
      padding: 0 10px;
      color: #b42318;
    }

    .delete-button:hover {
      background: #fee4e2;
    }
    
    .task {
      min-width: 0;
    }

.task input[type="text"] {
  min-width: 0;
}
.task textarea {
  flex: 1;
  min-width: 0;
  width: 100%;
  min-height: 38px;
  padding: 8px;
  border: 1px solid #888;
  border-radius: 6px;
  font: inherit;
  line-height: 1.4;
  resize: none;
  overflow: hidden;
}

.score-controls .increment-button,
.score-controls .decrement-button {
  background: #d1d5db;
  border-color: #9ca3af;
  color: #333;
}

.score-controls .increment-button:hover,
.score-controls .decrement-button:hover {
  background: #bfc5ce;
}

@media (max-width: 520px) {
  .task {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 8px;
  }

  .task textarea {
    grid-column: 1 / -1;
  }

  .score-controls {
    min-width: 0;
  }

  .delete-button {
    justify-self: end;
  }
}
    
  </style>
</head>

<body>

    <script>
        if (navigator.serviceWorker) {
            navigator.serviceWorker.register('/calendar/sw.js', {scope: '/calendar/'})
        }
    </script>

    <h1>Aufgaben</h1>
  <button id="add-task" type="button">+ Aufgabe</button>
  <ul id="tasks" aria-label="Aufgabenliste"></ul>

  <script>
  const STORAGE_KEY = "aufgabenliste";
  const taskList = document.querySelector("#tasks");
  const addButton = document.querySelector("#add-task");

  function saveTasks() {
    const tasks = [...taskList.querySelectorAll(".task")].map(task => ({
      name: task.querySelector("textarea").value,
      score: Number(task.querySelector('input[type="number"]').value),
      order: Number(task.dataset.order)
    }));

    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
    } catch (error) {
      console.error("Aufgaben konnten nicht gespeichert werden:", error);
    }
  }

  function autoResize(textarea) {
    textarea.style.height = "auto";
    textarea.style.height = `${textarea.scrollHeight}px`;
  }

  function updateTask(task, value) {
    const scoreInput = task.querySelector('input[type="number"]');
    const score = Math.max(0, Math.min(10, Math.round(Number(value) || 0)));

    scoreInput.value = String(score);

    const hue = 120 - score * 12;
    task.style.backgroundColor = `hsl(${hue} 85% 72%)`;
    task.style.borderColor = `hsl(${hue} 75% 45%)`;

    sortTasks();
    saveTasks();
  }

  function sortTasks() {
    const tasks = [...taskList.children];

    tasks.sort((a, b) => {
      const scoreA = Number(a.querySelector('input[type="number"]').value);
      const scoreB = Number(b.querySelector('input[type="number"]').value);
      return scoreB - scoreA || Number(a.dataset.order) - Number(b.dataset.order);
    });

    tasks.forEach(task => taskList.appendChild(task));
  }

  function createTask({ name = "", score = 0, order = Date.now() + Math.random() } = {}) {
    const task = document.createElement("li");
    task.className = "task";
    task.dataset.order = order;

    const nameInput = document.createElement("textarea");
    nameInput.placeholder = "Aufgabe eingeben";
    nameInput.setAttribute("aria-label", "Aufgabenname");
    nameInput.rows = 1;
    nameInput.value = name;
    nameInput.addEventListener("input", () => autoResize(nameInput));
    autoResize(nameInput);

    const controls = document.createElement("div");
    controls.className = "score-controls";

    const decrementButton = document.createElement("button");
    decrementButton.type = "button";
    decrementButton.className = "decrement-button";
    decrementButton.textContent = "−";
    decrementButton.setAttribute("aria-label", "Wert verringern");

    const scoreInput = document.createElement("input");
    scoreInput.type = "number";
    scoreInput.min = "0";
    scoreInput.max = "10";
    scoreInput.step = "1";
    scoreInput.disabled = true;
    scoreInput.value = String(Math.max(0, Math.min(10, Math.round(Number(score) || 0))));
    scoreInput.setAttribute("aria-label", "Wert von 0 bis 10");

    const incrementButton = document.createElement("button");
    incrementButton.type = "button";
    incrementButton.className = "increment-button";
    incrementButton.textContent = "+";
    incrementButton.setAttribute("aria-label", "Wert erhöhen");

    const deleteButton = document.createElement("button");
    deleteButton.type = "button";
    deleteButton.className = "delete-button";
    deleteButton.textContent = "Löschen";
    deleteButton.setAttribute("aria-label", "Aufgabe löschen");

    controls.append(decrementButton, scoreInput, incrementButton);
    task.append(nameInput, controls, deleteButton);
    taskList.appendChild(task);

    updateTask(task, scoreInput.value);
  }

  taskList.addEventListener("click", event => {
    const button = event.target.closest("button");
    if (!button) return;

    const task = button.closest(".task");
    if (!task) return;

    const scoreInput = task.querySelector('input[type="number"]');

    if (button.classList.contains("increment-button")) {
      updateTask(task, Number(scoreInput.value) + 1);
    } else if (button.classList.contains("decrement-button")) {
      updateTask(task, Number(scoreInput.value) - 1);
    } else if (button.classList.contains("delete-button")) {
      task.remove();
      saveTasks();
    }
  });

  taskList.addEventListener("input", event => {
    const task = event.target.closest(".task");
    if (!task) return;

    if (event.target.matches("textarea")) {
      autoResize(event.target);
      saveTasks();
    } else if (
      event.target.matches('input[type="number"]') &&
      event.target.value !== ""
    ) {
      updateTask(task, event.target.value);
    }
  });

  taskList.addEventListener("change", event => {
    const task = event.target.closest(".task");

    if (task && event.target.matches('input[type="number"]')) {
      updateTask(task, event.target.value);
    }
  });

  addButton.addEventListener("click", () => {
    createTask();
    saveTasks();
    taskList.lastElementChild?.querySelector("textarea").focus();
  });

  function loadTasks() {
    try {
      const savedTasks = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");

      if (Array.isArray(savedTasks) && savedTasks.length > 0) {
        savedTasks.forEach(createTask);
        sortTasks();
        return;
      }
    } catch (error) {
      console.error("Gespeicherte Aufgaben konnten nicht geladen werden:", error);
    }

    createTask();
  }

  loadTasks();
</script>

</body>

</html>
